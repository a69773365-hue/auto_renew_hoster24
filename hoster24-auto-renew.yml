name: hoster24auto_renew

on:
  schedule:
    - cron: "0 */12 * * *"   # 每12小时一次 (UTC 00:00 / 12:00)
  workflow_dispatch:          # 支持手动触发

concurrency:
  group: hoster24-auto-renew
  cancel-in-progress: false

env:
  HOSTER24_NODE: ${{ secrets.HOSTER24_NODE }}
  HOSTER24_NODE_INDEX: ${{ vars.HOSTER24_NODE_INDEX }}

jobs:
  start-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 仅当配置了 HOSTER24_NODE 时才启用代理节点
      - name: Start proxy node (sing-box)
        if: ${{ env.HOSTER24_NODE != '' }}
        run: |
          SB=1.10.7
          curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SB}/sing-box-${SB}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1 --wildcards '*/sing-box'
          node scripts/node2singbox.mjs > sb.json
          ./sing-box check -c sb.json
          nohup ./sing-box run -c sb.json > sb.log 2>&1 &
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/1080) 2>/dev/null && break
            sleep 1
          done
          echo "节点出口 IP:"
          curl -fsS --max-time 20 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org
          echo
          echo "HOSTER24_PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Start server on hoster24
        env:
          HOSTER24_COOKIE: ${{ secrets.HOSTER24_COOKIE }}
          HOSTER24_USERNAME: ${{ secrets.HOSTER24_USERNAME }}
          HOSTER24_PASSWORD: ${{ secrets.HOSTER24_PASSWORD }}
          HOSTER24_SERVER_URL: ${{ vars.HOSTER24_SERVER_URL }}
          HOSTER24_START_SELECTOR: ${{ vars.HOSTER24_START_SELECTOR }}
        run: node scripts/hoster24.mjs

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 3
